<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#01040b">

<title>NEGIN — Moonlight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Italiana&family=Montserrat:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --night:#01040b;
  --deep:#030914;
  --ice:#eaf6ff;
  --blue:#9fd2ff;
  --silver:#dbeaff;
}

html{
  width:100%;
  height:100%;
  background:var(--night);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  width:100%;
  min-height:100%;
  margin:0;
  overflow:hidden;
  background:var(--night);
  color:white;
  font-family:"Montserrat",sans-serif;
  overscroll-behavior:none;
}

img{
  display:block;
  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene{
  position:relative;
  width:100%;
  height:100vh;
  height:100svh;
  height:100dvh;
  min-height:580px;

  overflow:hidden;
  isolation:isolate;

  background:
    radial-gradient(
      ellipse at 50% 32%,
      rgba(60,115,180,.24),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 50% 92%,
      rgba(30,80,125,.17),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #010208 0%,
      #020712 42%,
      #06111f 72%,
      #010309 100%
    );
}

.scene::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 42%,
      rgba(0,0,0,.13) 68%,
      rgba(0,0,0,.78) 125%
    );
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  pointer-events:none;
  z-index:0;
}

.ambient.a1{
  width:60vw;
  height:55vw;
  left:-22%;
  top:-25%;
  background:rgba(60,130,215,.15);
  animation:ambientOne 15s ease-in-out infinite alternate;
}

.ambient.a2{
  width:55vw;
  height:55vw;
  right:-20%;
  bottom:-30%;
  background:rgba(100,165,225,.11);
  animation:ambientTwo 19s ease-in-out infinite alternate;
}

@keyframes ambientOne{
  to{
    transform:translate(120px,80px) scale(1.2);
  }
}

@keyframes ambientTwo{
  to{
    transform:translate(-100px,-70px) scale(1.2);
  }
}


/* =========================================================
   STARS
========================================================= */

.stars{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
}

.star{
  position:absolute;
  border-radius:50%;
  background:white;

  box-shadow:
    0 0 5px white,
    0 0 12px #8bc8ff;

  animation:twinkle var(--speed) ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.5);
  }

  50%{
    opacity:1;
    transform:scale(1.8);
  }
}


/* =========================================================
   SHOOTING STAR
========================================================= */

.shooting-star{
  position:absolute;
  width:190px;
  height:1px;
  left:-30%;
  top:14%;
  z-index:2;
  opacity:0;

  transform:rotate(-17deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      #9ecfff,
      white
    );

  box-shadow:0 0 12px #b7dcff;

  animation:shootingStar 13s 4s infinite;
}

@keyframes shootingStar{
  0%{
    left:-30%;
    opacity:0;
  }

  3%{
    opacity:1;
  }

  14%{
    left:120%;
    opacity:0;
  }

  100%{
    left:120%;
    opacity:0;
  }
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud{
  position:absolute;
  width:620px;
  height:180px;
  border-radius:50%;
  filter:blur(30px);
  opacity:.22;
  z-index:5;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse,
      rgba(125,155,190,.6),
      transparent 70%
    );

  animation:cloudMove 24s ease-in-out infinite alternate;
}

.cloud.c1{
  left:-15%;
  top:31%;
}

.cloud.c2{
  right:-18%;
  top:39%;
  animation-duration:30s;
}

@keyframes cloudMove{
  from{
    transform:translateX(-100px);
  }

  to{
    transform:translateX(190px);
  }
}


/* =========================================================
   MOON
========================================================= */

.moon-wrap{
  position:absolute;

  left:50%;
  top:31%;

  width:min(50vw,720px);
  aspect-ratio:1 / 1;

  transform:translate(-50%,-50%);

  z-index:4;
  border-radius:50%;

  animation:
    moonEntrance
    1.8s cubic-bezier(.2,.8,.2,1)
    both;
}

.moon-wrap::before{
  content:"";
  position:absolute;
  inset:-15%;
  z-index:-1;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(235,248,255,.38),
      rgba(150,205,255,.18) 40%,
      rgba(70,135,205,.07) 61%,
      transparent 75%
    );

  filter:blur(30px);
  animation:moonPulse 6s ease-in-out infinite;
}

.moon-wrap::after{
  content:"";
  position:absolute;
  inset:-1.5%;
  border-radius:50%;

  border:1px solid rgba(220,240,255,.22);

  box-shadow:
    0 0 38px rgba(150,205,255,.25);
}

.moon{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  border-radius:50%;

  mix-blend-mode:screen;

  filter:
    brightness(.97)
    contrast(1.10)
    drop-shadow(0 0 16px rgba(235,248,255,.95))
    drop-shadow(0 0 55px rgba(130,190,255,.45));
}

@keyframes moonEntrance{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(.72);
    filter:blur(20px);
  }

  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0);
  }
}

@keyframes moonPulse{
  0%,100%{
    transform:scale(.96);
    opacity:.72;
  }

  50%{
    transform:scale(1.07);
    opacity:1;
  }
}


/* =========================================================
   NEGIN PORTRAIT
========================================================= */

.NEGIN-wrap{
  position:absolute;

  left:50%;
  top:33%;

  width:min(40vw,590px);

  transform:translate(-50%,-50%);

  z-index:15;

  filter:
    drop-shadow(
      0 20px 32px
      rgba(0,0,0,.72)
    );

  animation:
    NEGINEntrance
    1.8s .25s
    cubic-bezier(.2,.8,.2,1)
    both;
}

.NEGIN-wrap::before{
  content:"";

  position:absolute;

  width:125%;
  height:115%;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:-1;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(210,235,255,.16),
      transparent 66%
    );

  filter:blur(25px);
}

.NEGIN-img{
  display:block;

  width:100%;
  height:auto;

  object-fit:contain;
  object-position:center;

  filter:
    brightness(.94)
    contrast(1.05)
    saturate(.92)
    drop-shadow(
      0 0 15px
      rgba(130,185,235,.14)
    );

  transition:transform .8s ease;
}

.NEGIN-wrap:hover .NEGIN-img{
  transform:scale(1.02);
}

.NEGIN-light{
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      105deg,
      rgba(175,220,255,.10),
      transparent 37%
    );

  mix-blend-mode:screen;
}

@keyframes NEGINEntrance{
  from{
    opacity:0;

    transform:
      translate(-50%,-44%)
      scale(.88);

    filter:
      blur(12px)
      drop-shadow(
        0 20px 32px
        rgba(0,0,0,.72)
      );
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

    filter:
      blur(0)
      drop-shadow(
        0 20px 32px
        rgba(0,0,0,.72)
      );
  }
}


/* =========================================================
   FLOWERS
========================================================= */

.flower{
  position:absolute;

  pointer-events:none;

  mix-blend-mode:screen;

  filter:
    brightness(.9)
    contrast(1.15)
    saturate(.9)
    drop-shadow(
      0 14px 25px
      rgba(0,0,0,.7)
    );

  transform-origin:center;

  will-change:transform;
}

.flower.f1{
  width:min(43vw,670px);

  left:-7%;
  top:-10%;

  z-index:18;

  animation:swayOne 7s ease-in-out infinite;
}

.flower.f2{
  width:min(42vw,650px);

  right:-8%;
  top:-11%;

  z-index:18;

  animation:swayTwo 8.5s ease-in-out infinite;
}

.flower.f3{
  width:min(30vw,450px);

  left:-15%;
  top:30%;

  z-index:20;

  animation:swayThree 9s ease-in-out infinite;
}

.flower.f4{
  width:min(30vw,450px);

  right:-15%;
  top:31%;

  z-index:20;

  animation:swayFour 8s ease-in-out infinite;
}

.flower.f5{
  width:min(47vw,720px);

  left:-10%;
  bottom:-33%;

  z-index:38;

  animation:swayFive 8.5s ease-in-out infinite;
}

.flower.f6{
  width:min(48vw,740px);

  right:-11%;
  bottom:-34%;

  z-index:38;

  animation:swaySix 9.5s ease-in-out infinite;
}


/* =========================================================
   FLOWER ANIMATION
========================================================= */

@keyframes swayOne{
  0%,100%{
    transform:rotate(-4deg) translateY(0);
  }

  50%{
    transform:rotate(1deg) translate(8px,-10px);
  }
}

@keyframes swayTwo{
  0%,100%{
    transform:scaleX(-1) rotate(-3deg);
  }

  50%{
    transform:
      scaleX(-1)
      rotate(2deg)
      translate(-8px,-9px);
  }
}

@keyframes swayThree{
  0%,100%{
    transform:
      rotate(75deg)
      translateY(0);
  }

  50%{
    transform:
      rotate(79deg)
      translateY(-12px);
  }
}

@keyframes swayFour{
  0%,100%{
    transform:
      scaleX(-1)
      rotate(74deg);
  }

  50%{
    transform:
      scaleX(-1)
      rotate(78deg)
      translateY(-10px);
  }
}

@keyframes swayFive{
  0%,100%{
    transform:
      rotate(12deg)
      scale(1.12);
  }

  50%{
    transform:
      rotate(15deg)
      scale(1.14)
      translateY(-12px);
  }
}

@keyframes swaySix{
  0%,100%{
    transform:
      scaleX(-1)
      rotate(12deg)
      scale(1.13);
  }

  50%{
    transform:
      scaleX(-1)
      rotate(9deg)
      scale(1.15)
      translateY(-12px);
  }
}


/* =========================================================
   SIDE TEXT
========================================================= */

.side-copy{
  position:absolute;

  top:36%;

  width:220px;

  z-index:28;

  text-align:center;
}

.side-copy.left{
  left:7%;
}

.side-copy.right{
  right:7%;
}

.side-main{
  font-family:"Italiana",serif;

  font-size:11px;

  line-height:2.15;

  letter-spacing:8px;

  color:#e4f1ff;
}

.side-divider{
  display:flex;

  align-items:center;
  justify-content:center;

  width:130px;

  gap:12px;

  margin:14px auto;
}

.side-divider span{
  height:1px;
  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      #dceeff
    );
}

.side-divider span:last-child{
  background:
    linear-gradient(
      90deg,
      #dceeff,
      transparent
    );
}

.side-divider i{
  font-style:normal;

  font-size:12px;

  color:white;

  text-shadow:0 0 12px #9fd1ff;
}

.side-script{
  font-family:"Cormorant Garamond",serif;

  font-size:17px;

  line-height:1.55;

  font-style:italic;

  color:#b9cadc;

  letter-spacing:1px;
}


/* =========================================================
   NEGIN NAME
========================================================= */

.name-area{
  position:absolute;

  left:50%;
  top:62%;

  transform:translateX(-50%);

  width:100%;

  z-index:50;

  text-align:center;

  pointer-events:none;
}

.name{
  position:relative;

  display:inline-block;

  margin:0 auto;

  font-family:"Great Vibes",cursive;

  font-weight:400;

  font-size:clamp(125px,14vw,235px);

  line-height:1;

  /*
     Extra space protects the bottom
     swashes of the script font.
  */

  padding:
    .08em
    .16em
    .22em;

  white-space:nowrap;

  color:transparent;

  background:
    linear-gradient(
      110deg,
      #4d6379 0%,
      #c8e2fa 9%,
      #ffffff 17%,
      #738da6 27%,
      #ffffff 38%,
      #b9dcf7 50%,
      #ffffff 62%,
      #667e96 73%,
      #ffffff 86%,
      #91b8da 100%
    );

  background-size:350% auto;

  -webkit-background-clip:text;
  background-clip:text;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(0,0,0,.9)
    )
    drop-shadow(
      0 0 14px
      rgba(175,220,255,.7)
    );

  animation:silverMove 6s linear infinite;
}

@keyframes silverMove{
  to{
    background-position:350% center;
  }
}

.name-shine{
  position:absolute;

  left:50%;
  bottom:12px;

  width:min(520px,55vw);
  height:1px;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      transparent,
      white,
      transparent
    );

  box-shadow:0 0 15px #a7d6ff;
}

.crescent{
  position:absolute;

  left:50%;
  top:-16px;

  transform:translateX(-50%);

  font-size:38px;

  color:#f2f9ff;

  text-shadow:0 0 20px #9fd2ff;

  animation:crescentPulse 3s ease-in-out infinite;
}

@keyframes crescentPulse{
  50%{
    transform:
      translateX(-50%)
      scale(1.17);

    text-shadow:0 0 30px white;
  }
}

.tagline{
  margin-top:-2px;

  padding:0 15px;

  font-family:"Italiana",serif;

  font-size:9px;

  line-height:1.7;

  letter-spacing:10px;

  color:#e0effd;
}


/* =========================================================
   WATER
========================================================= */

.water{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:31%;

  z-index:7;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 6px,
      rgba(165,210,250,.045) 7px,
      transparent 8px
    ),
    radial-gradient(
      ellipse at 50% 0%,
      rgba(215,238,255,.17),
      transparent 50%
    );

  opacity:.7;

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      transparent,
      black
    );

  mask-image:
    linear-gradient(
      to bottom,
      transparent,
      black
    );

  animation:waterMove 4s linear infinite;
}

@keyframes waterMove{
  to{
    background-position:
      0 16px,
      center;
  }
}


/* =========================================================
   REFLECTION
========================================================= */

.reflection{
  position:absolute;

  left:50%;
  bottom:0;

  width:190px;
  height:28%;

  transform:translateX(-50%);

  z-index:8;

  opacity:.35;

  filter:blur(8px);

  background:
    linear-gradient(
      to bottom,
      rgba(225,242,255,.4),
      transparent
    );

  clip-path:
    polygon(
      43% 0,
      57% 0,
      100% 100%,
      0 100%
    );

  animation:reflectionMove 4s ease-in-out infinite;
}

@keyframes reflectionMove{
  50%{
    width:230px;
    opacity:.45;
  }
}


/* =========================================================
   BUTTERFLIES
========================================================= */

.butterfly{
  position:absolute;

  width:48px;
  height:32px;

  z-index:31;

  pointer-events:none;

  filter:drop-shadow(0 0 12px #8ec9ff);
}

.butterfly::before,
.butterfly::after{
  content:"";

  position:absolute;

  top:3px;

  width:24px;
  height:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.98),
      rgba(100,175,235,.28)
    );

  animation:
    wing .3s
    ease-in-out infinite alternate;
}

.butterfly::before{
  left:0;

  border-radius:
    90% 20%
    80% 20%;

  transform-origin:right center;
}

.butterfly::after{
  right:0;

  border-radius:
    20% 90%
    20% 80%;

  transform-origin:left center;
}

.butterfly.b1{
  left:18%;
  top:38%;

  animation:flyOne 11s ease-in-out infinite;
}

.butterfly.b2{
  right:16%;
  top:48%;

  transform:scale(.75);

  animation:flyTwo 13s ease-in-out infinite;
}

@keyframes wing{
  to{
    transform:scaleX(.16);
  }
}

@keyframes flyOne{
  0%,100%{
    transform:
      translate(0,0)
      rotate(-8deg);
  }

  50%{
    transform:
      translate(110px,-80px)
      rotate(9deg);
  }
}

@keyframes flyTwo{
  0%,100%{
    transform:
      scale(.75)
      translate(0,0);
  }

  50%{
    transform:
      scale(.75)
      translate(-120px,70px);
  }
}


/* =========================================================
   PETALS
========================================================= */

.petal{
  position:absolute;

  top:-40px;

  width:12px;
  height:20px;

  z-index:65;

  pointer-events:none;

  border-radius:
    80% 10%
    80% 10%;

  background:
    linear-gradient(
      135deg,
      white,
      #c5e2f8 60%,
      #7691aa
    );

  box-shadow:
    0 0 9px
    rgba(180,220,255,.35);

  animation:petalFall linear forwards;
}

@keyframes petalFall{
  0%{
    opacity:0;

    transform:
      translate(0,-30px)
      rotate(0);
  }

  10%{
    opacity:.9;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--drift),
        110vh
      )
      rotate(760deg);
  }
}


/* =========================================================
   MAGIC DUST
========================================================= */

.dust{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  z-index:29;

  pointer-events:none;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 16px #7fc2ff;

  animation:
    dustMove
    var(--duration)
    ease-in-out infinite alternate;
}

@keyframes dustMove{
  from{
    opacity:.12;

    transform:
      translate(0,0)
      scale(.5);
  }

  to{
    opacity:1;

    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(1.6);
  }
}


/* =========================================================
   MIST
========================================================= */

.mist{
  position:absolute;

  width:130%;
  height:260px;

  left:-15%;
  bottom:-90px;

  z-index:45;

  pointer-events:none;

  filter:blur(30px);

  background:
    radial-gradient(
      ellipse,
      rgba(180,215,245,.16),
      rgba(70,105,140,.05) 48%,
      transparent 72%
    );

  animation:mistMove 12s ease-in-out infinite alternate;
}

@keyframes mistMove{
  from{
    transform:translateX(-4%);
  }

  to{
    transform:translateX(4%);
  }
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottom-copy{
  position:absolute;

  bottom:4%;

  z-index:55;

  width:220px;

  text-align:center;

  font-family:"Italiana",serif;

  font-size:7px;

  line-height:1.9;

  letter-spacing:5px;

  color:
    rgba(215,232,248,.72);
}

.bottom-copy.left{
  left:4%;
}

.bottom-copy.right{
  right:4%;
}


/* =========================================================
   SCROLL
========================================================= */

.scroll{
  position:absolute;

  left:50%;
  bottom:3%;

  transform:translateX(-50%);

  z-index:56;

  text-align:center;

  color:#dbeeff;

  font-size:7px;

  letter-spacing:5px;
}

.mouse{
  position:relative;

  width:18px;
  height:29px;

  margin:0 auto 7px;

  border:
    1px solid
    rgba(220,240,255,.8);

  border-radius:10px;
}

.mouse::after{
  content:"";

  position:absolute;

  width:2px;
  height:5px;

  top:5px;
  left:50%;

  transform:translateX(-50%);

  border-radius:5px;

  background:white;

  animation:mouseMove 1.6s ease infinite;
}

@keyframes mouseMove{
  0%{
    transform:translate(-50%,0);
    opacity:1;
  }

  100%{
    transform:translate(-50%,10px);
    opacity:0;
  }
}


/* =========================================================
   CURSOR LIGHT
========================================================= */

.cursor-light{
  position:fixed;

  width:500px;
  height:500px;

  border-radius:50%;

  transform:translate(-50%,-50%);

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const scene =
  document.getElementById("scene");

const stars =
  document.getElementById("stars");

const moon =
  document.getElementById("moon");

const NEGIN =
  document.getElementById("NEGIN");

const cursorLight =
  document.getElementById("cursorLight");

const flower1 =
  document.getElementById("flower1");

const flower2 =
  document.getElementById("flower2");

const flower3 =
  document.getElementById("flower3");

const flower4 =
  document.getElementById("flower4");

const flower5 =
  document.getElementById("flower5");

const flower6 =
  document.getElementById("flower6");


const finePointer =
  window.matchMedia(
    "(pointer:fine)"
  ).matches;

const mobile =
  window.matchMedia(
    "(max-width:700px)"
  ).matches;


/* =========================================================
   STARS
========================================================= */

const starCount =
  mobile ? 80 : 200;


for(let i=0; i<starCount; i++){

  const star =
    document.createElement("span");

  star.className =
    "star";

  star.style.left =
    Math.random()*100+"%";

  star.style.top =
    Math.random()*100+"%";

  const size =
    Math.random()*2.4+.4;

  star.style.width =
    size+"px";

  star.style.height =
    size+"px";

  star.style.setProperty(
    "--speed",
    (
      Math.random()*4+2
    )+"s"
  );

  star.style.animationDelay =
    Math.random()*6+"s";

  stars.appendChild(star);
}


/* =========================================================
   MAGIC DUST
========================================================= */

const dustCount =
  mobile ? 16 : 40;


for(let i=0; i<dustCount; i++){

  const dust =
    document.createElement("span");

  dust.className =
    "dust";

  dust.style.left =
    (
      10+
      Math.random()*80
    )+"%";

  dust.style.top =
    (
      10+
      Math.random()*75
    )+"%";

  dust.style.setProperty(
    "--duration",
    (
      Math.random()*5+4
    )+"s"
  );

  dust.style.setProperty(
    "--dx",
    (
      Math.random()*70-35
    )+"px"
  );

  dust.style.setProperty(
    "--dy",
    (
      Math.random()*90-45
    )+"px"
  );

  dust.style.animationDelay =
    Math.random()*5+"s";

  scene.appendChild(dust);
}


/* =========================================================
   FALLING PETALS
========================================================= */

function createPetal(){

  const petal =
    document.createElement("span");

  petal.className =
    "petal";

  petal.style.left =
    Math.random()*100+"vw";

  const size =
    Math.random()*10+7;

  petal.style.width =
    size+"px";

  petal.style.height =
    size*1.55+"px";

  petal.style.setProperty(
    "--drift",
    (
      Math.random()*280-140
    )+"px"
  );

  const duration =
    Math.random()*6+8;

  petal.style.animationDuration =
    duration+"s";

  scene.appendChild(petal);

  setTimeout(
    ()=>petal.remove(),
    duration*1000
  );
}


const petalTimer =
  setInterval(
    createPetal,
    mobile ? 1100 : 520
  );


/* =========================================================
   DESKTOP PARALLAX
   ONLY desktop/mouse devices move the portrait + moon.
   iPhone stays perfectly centered.
========================================================= */

if(finePointer){

  window.addEventListener(
    "mousemove",
    e=>{

      const x =
        e.clientX /
        window.innerWidth
        -.5;

      const y =
        e.clientY /
        window.innerHeight
        -.5;


      /* cursor glow */

      cursorLight.style.left =
        e.clientX+"px";

      cursorLight.style.top =
        e.clientY+"px";


      /* portrait */

      NEGIN.style.marginLeft =
        x*7+"px";

      NEGIN.style.marginTop =
        y*5+"px";


      /* moon */

      moon.style.marginLeft =
        x*-12+"px";

      moon.style.marginTop =
        y*-8+"px";


      /* flowers */

      flower1.style.marginLeft =
        x*-8+"px";

      flower1.style.marginTop =
        y*-5+"px";


      flower2.style.marginRight =
        x*8+"px";

      flower2.style.marginTop =
        y*-5+"px";


      flower3.style.marginLeft =
        x*-10+"px";


      flower4.style.marginRight =
        x*10+"px";


      flower5.style.marginLeft =
        x*-14+"px";

      flower5.style.marginBottom =
        y*9+"px";


      flower6.style.marginRight =
        x*14+"px";

      flower6.style.marginBottom =
        y*9+"px";

    }
  );

}else{

  /*
     IMPORTANT:
     iPhone / touch devices stay locked
     exactly in the middle.
  */

  cursorLight.style.display =
    "none";

  NEGIN.style.marginLeft =
    "0px";

  NEGIN.style.marginTop =
    "0px";

  moon.style.marginLeft =
    "0px";

  moon.style.marginTop =
    "0px";
}


/* =========================================================
   RIPPLE
========================================================= */

function createRipple(x,y){

  const ripple =
    document.createElement("span");

  Object.assign(
    ripple.style,
    {
      position:"fixed",
      left:x+"px",
      top:y+"px",

      width:"7px",
      height:"7px",

      borderRadius:"50%",

      border:
        "1px solid rgba(225,242,255,.95)",

      boxShadow:
        "0 0 20px rgba(130,200,255,.8)",

      transform:
        "translate(-50%,-50%)",

      pointerEvents:"none",

      zIndex:"2000",

      transition:
        "all .9s cubic-bezier(.2,.8,.2,1)"
    }
  );

  document.body.appendChild(ripple);

  requestAnimationFrame(
    ()=>{

      ripple.style.width =
        "180px";

      ripple.style.height =
        "180px";

      ripple.style.opacity =
        "0";

    }
  );

  setTimeout(
    ()=>ripple.remove(),
    950
  );
}


/* =========================================================
   SPARKLES
========================================================= */

function sparkleBurst(x,y){

  const amount =
    mobile ? 6 : 14;

  for(let i=0; i<amount; i++){

    const sparkle =
      document.createElement("span");

    const angle =
      Math.PI*2 /
      amount*i;

    const distance =
      Math.random()*65+30;

    Object.assign(
      sparkle.style,
      {
        position:"fixed",

        left:x+"px",
        top:y+"px",

        width:"4px",
        height:"4px",

        borderRadius:"50%",

        background:"white",

        boxShadow:
          "0 0 12px #8fcaff",

        pointerEvents:"none",

        zIndex:"2100",

        transition:
          "all .8s ease-out"
      }
    );

    document.body.appendChild(
      sparkle
    );

    requestAnimationFrame(
      ()=>{

        sparkle.style.transform =
          `translate(
            ${Math.cos(angle)*distance}px,
            ${Math.sin(angle)*distance}px
          ) scale(.1)`;

        sparkle.style.opacity =
          "0";

      }
    );

    setTimeout(
      ()=>sparkle.remove(),
      850
    );
  }
}


/* =========================================================
   CLICK / TAP EFFECT
========================================================= */

document.addEventListener(
  "click",
  e=>{

    createRipple(
      e.clientX,
      e.clientY
    );

    sparkleBurst(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================================================
   DOUBLE CLICK HEART
========================================================= */

document.addEventListener(
  "dblclick",
  e=>{

    createHeart(
      e.clientX,
      e.clientY
    );

  }
);


function createHeart(x,y){

  const heart =
    document.createElement("div");

  heart.textContent =
    "♡";

  Object.assign(
    heart.style,
    {
      position:"fixed",

      left:x+"px",
      top:y+"px",

      transform:
        "translate(-50%,-50%)",

      fontSize:
        mobile ? "55px" : "70px",

      color:"#f2f9ff",

      textShadow:
        "0 0 30px #8dc9ff",

      pointerEvents:"none",

      zIndex:"2200",

      transition:
        "all 1.15s ease"
    }
  );

  document.body.appendChild(
    heart
  );

  requestAnimationFrame(
    ()=>{

      heart.style.transform =
        "translate(-50%,-50%) scale(2.6)";

      heart.style.opacity =
        "0";

    }
  );

  setTimeout(
    ()=>heart.remove(),
    1200
  );
}


/* =========================================================
   DOUBLE TAP HEART ON iPHONE
========================================================= */

let lastTap = 0;


scene.addEventListener(
  "touchend",
  e=>{

    const now =
      Date.now();

    const difference =
      now-lastTap;

    if(
      difference > 0 &&
      difference < 300 &&
      e.changedTouches.length
    ){

      const touch =
        e.changedTouches[0];

      createHeart(
        touch.clientX,
        touch.clientY
      );
    }

    lastTap =
      now;

  },
  {
    passive:true
  }
);


/* =========================================================
   KEEP CENTER AFTER RESIZE / ROTATION
========================================================= */

function resetMobilePosition(){

  if(
    window.matchMedia(
      "(pointer:coarse)"
    ).matches ||
    window.innerWidth <= 700
  ){

    NEGIN.style.marginLeft =
      "0px";

    NEGIN.style.marginTop =
      "0px";

    moon.style.marginLeft =
      "0px";

    moon.style.marginTop =
      "0px";
  }
}


window.addEventListener(
  "resize",
  resetMobilePosition
);


window.addEventListener(
  "orientationchange",
  ()=>{

    setTimeout(
      resetMobilePosition,
      150
    );

  }
);

</script>
